name: Java

on:
  pull_request:
    types:
      closed
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn -B compile

  tagging:
    runs-on: ubuntu-latest
    needs: [build]
    env:
      TAG: "build-${{ github.run_id }}"
    steps:
      - name: Printa tag
        run: echo $TAG

