name: Java

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Tests
        run: mvn test

      - name: Build
        run: mvn -B compile
  imagem:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Construir a imagem
        run: docker build -t imagem-app:ci ./java
        
      - name: Subir o contêiner
        run: docker run -d --name app -p 8080:8080 imagem-app:ci

      - name: Logs do contêiner
        if: failure()
        run: docker logs app
